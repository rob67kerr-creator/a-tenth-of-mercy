<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Webisodes | A Tenth of Mercy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    /* --------------------------------------------------
       ROOM
    -------------------------------------------------- */

    .room {
      position: relative;
      width: 100%;
      max-width: 1100px;
      line-height: 0;
    }

    .room-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* --------------------------------------------------
       HAMBURGER MENU
    -------------------------------------------------- */

    .menu-button {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 1000;

      width: 48px;
      height: 48px;

      border: 1px solid rgba(210, 166, 70, 0.75);
      border-radius: 4px;

      background: rgba(0, 0, 0, 0.72);
      color: #d8ad52;

      cursor: pointer;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;

      transition: background 0.25s ease,
                  transform 0.25s ease;
    }

    .menu-button:hover {
      background: rgba(35, 25, 10, 0.9);
      transform: scale(1.04);
    }

    .menu-button span {
      display: block;
      width: 23px;
      height: 2px;
      background: #d8ad52;
    }

    .menu {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999;

      width: 300px;
      max-width: 85vw;
      height: 100vh;

      padding: 90px 35px 40px;

      background: rgba(8, 6, 3, 0.97);
      border-right: 1px solid rgba(210, 166, 70, 0.55);

      transform: translateX(-100%);
      transition: transform 0.35s ease;

      line-height: 1.4;
    }

    .menu.open {
      transform: translateX(0);
    }

    .menu a {
      display: block;
      padding: 14px 0;

      color: #d8ad52;
      text-decoration: none;

      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;

      border-bottom: 1px solid rgba(210, 166, 70, 0.18);

      transition: color 0.2s ease,
                  padding-left 0.2s ease;
    }

    .menu a:hover {
      color: #f2d28a;
      padding-left: 6px;
    }

    .menu a.active {
      color: #f2d28a;
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 998;

      background: rgba(0, 0, 0, 0.55);

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.35s ease;
    }

    .menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* --------------------------------------------------
       CLICKABLE FILM REELS
    -------------------------------------------------- */

    .reel {
      position: absolute;
      z-index: 10;

      cursor: pointer;

      /*
        Invisible hotspot.
        The subtle outline appears only when hovering
        on desktop so we can see what is clickable
        while testing.
      */

      border: 1px solid transparent;
      border-radius: 18px;

      transition: background 0.25s ease,
                  border-color 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .reel:hover {
      background: rgba(212, 167, 74, 0.10);
      border-color: rgba(212, 167, 74, 0.45);
      box-shadow: 0 0 22px rgba(212, 167, 74, 0.20);
    }

    /*
      These percentages correspond to the reel stack
      in the artwork you uploaded.

      Reel One
    */

    #reel-one {
      left: 2%;
      top: 54.5%;
      width: 22%;
      height: 4.3%;
    }

    #reel-two {
      left: 2%;
      top: 58.0%;
      width: 22%;
      height: 4.3%;
    }

    #reel-three {
      left: 2%;
      top: 61.5%;
      width: 22%;
      height: 4.3%;
    }

    /*
      Reel Four is intentionally NOT clickable yet.
    */

    /* --------------------------------------------------
       VIDEO MODAL
    -------------------------------------------------- */

    .video-modal {
      position: fixed;
      inset: 0;
      z-index: 2000;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;

      background: rgba(0, 0, 0, 0.92);

      opacity: 0;
      visibility: hidden;

      transition: opacity 0.3s ease,
                  visibility 0.3s ease;
    }

    .video-modal.open {
      opacity: 1;
      visibility: visible;
    }

    .video-box {
      position: relative;

      width: min(1100px, 94vw);

      background: #000;

      box-shadow:
        0 0 0 1px rgba(212, 167, 74, 0.55),
        0 0 50px rgba(0, 0, 0, 0.9);

      line-height: 0;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    .video-container iframe {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
    }

    .video-title {
      position: absolute;
      left: 0;
      top: -42px;

      color: #d8ad52;

      font-size: 16px;
      letter-spacing: 2px;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .close-video {
      position: absolute;

      top: -50px;
      right: 0;

      width: 38px;
      height: 38px;

      border: 1px solid rgba(212, 167, 74, 0.7);
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.8);
      color: #d8ad52;

      font-family: Arial, sans-serif;
      font-size: 25px;
      line-height: 35px;

      cursor: pointer;

      transition: background 0.2s ease,
                  color 0.2s ease;
    }

    .close-video:hover {
      background: #d8ad52;
      color: #000;
    }

    /* --------------------------------------------------
       MOBILE
    -------------------------------------------------- */

    @media (max-width: 700px) {

      .menu-button {
        top: 14px;
        left: 14px;

        width: 43px;
        height: 43px;
      }

      .menu {
        width: 280px;
        padding-top: 78px;
      }

      .menu a {
        font-size: 16px;
      }

      .video-modal {
        padding: 15px;
      }

      .video-title {
        top: -34px;
        font-size: 13px;
      }

      .close-video {
        top: -42px;

        width: 32px;
        height: 32px;

        font-size: 21px;
        line-height: 29px;
      }
    }
  </style>
</head>

<body>

  <!-- ================================================
       HAMBURGER BUTTON
  ================================================= -->

  <button
    class="menu-button"
    id="menuButton"
    aria-label="Open menu"
    aria-expanded="false">

    <span></span>
    <span></span>
    <span></span>

  </button>


  <!-- ================================================
       NAVIGATION
  ================================================= -->

  <nav class="menu" id="menu">

    <a href="index.html">Home</a>

    <a href="excerpt.html">Read an Excerpt</a>

    <a href="archive.html">Archive Room</a>

    <a href="webisodes.html" class="active">Webisodes</a>

    <a href="journey.html">The Journey</a>

    <a href="contact.html">Contact</a>

  </nav>

  <div class="menu-overlay" id="menuOverlay"></div>


  <!-- ================================================
       WEBISODES ROOM
  ================================================= -->

  <main class="room">

    <img
      src="webisodes.png"
      class="room-image"
      alt="Webisodes room for A Tenth of Mercy">


    <!-- REEL ONE -->

    <button
      class="reel"
      id="reel-one"
      aria-label="Watch Episode One: A Visit to Institute, West Virginia">
    </button>


    <!-- REEL TWO -->

    <button
      class="reel"
      id="reel-two"
      aria-label="Watch Episode Two: A Visit to the Cultural Center">
    </button>


    <!-- REEL THREE -->

    <button
      class="reel"
      id="reel-three"
      aria-label="Watch the Blooper Reel">
    </button>

  </main>


  <!-- ================================================
       VIDEO WINDOW
  ================================================= -->

  <div
    class="video-modal"
    id="videoModal"
    aria-hidden="true">

    <div class="video-box">

      <div
        class="video-title"
        id="videoTitle">
      </div>

      <button
        class="close-video"
        id="closeVideo"
        aria-label="Close video">
        ×
      </button>

      <div class="video-container">

        <iframe
          id="videoFrame"
          src=""
          title="A Tenth of Mercy Webisode"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>

      </div>

    </div>

  </div>


  <script>

    /* =================================================
       MENU
    ================================================= */

    const menuButton = document.getElementById("menuButton");
    const menu = document.getElementById("menu");
    const menuOverlay = document.getElementById("menuOverlay");

    function toggleMenu() {

      const isOpen = menu.classList.toggle("open");

      menuOverlay.classList.toggle("open", isOpen);

      menuButton.setAttribute("aria-expanded", isOpen);

    }

    function closeMenu() {

      menu.classList.remove("open");

      menuOverlay.classList.remove("open");

      menuButton.setAttribute("aria-expanded", "false");

    }

    menuButton.addEventListener("click", toggleMenu);

    menuOverlay.addEventListener("click", closeMenu);


    /* =================================================
       WEBISODE VIDEOS
    ================================================= */

    const videos = {

      "reel-one": {
        title: "Episode 1 — A Visit to Institute, WV",
        id: "VohUntGNZ48"
      },

      "reel-two": {
        title: "Episode 2 — A Visit to the Cultural Center",
        id: "X7b2kU7Esuw"
      },

      "reel-three": {
        title: "Blooper Reel",
        id: "tomU3GP_PCA"
      }

    };


    const videoModal = document.getElementById("videoModal");

    const videoFrame = document.getElementById("videoFrame");

    const videoTitle = document.getElementById("videoTitle");

    const closeVideo = document.getElementById("closeVideo");


    function openVideo(reelId) {

      const video = videos[reelId];

      if (!video) {
        return;
      }

      videoTitle.textContent = video.title;

      videoFrame.src =
        "https://www.youtube-nocookie.com/embed/" +
        video.id +
        "?autoplay=1&rel=0";

      videoModal.classList.add("open");

      videoModal.setAttribute("aria-hidden", "false");

      document.body.style.overflow = "hidden";

    }


    function closeVideoWindow() {

      videoModal.classList.remove("open");

      videoModal.setAttribute("aria-hidden", "true");

      /*
        Removing the YouTube URL stops the video completely.
      */

      videoFrame.src = "";

      document.body.style.overflow = "";

    }


    document
      .getElementById("reel-one")
      .addEventListener("click", function() {
        openVideo("reel-one");
      });


    document
      .getElementById("reel-two")
      .addEventListener("click", function() {
        openVideo("reel-two");
      });


    document
      .getElementById("reel-three")
      .addEventListener("click", function() {
        openVideo("reel-three");
      });


    closeVideo.addEventListener("click", closeVideoWindow);


    /*
      Clicking the dark area outside the video
      also closes the video.
    */

    videoModal.addEventListener("click", function(event) {

      if (event.target === videoModal) {
        closeVideoWindow();
      }

    });


    /*
      Escape key closes the video.
    */

    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {

        if (videoModal.classList.contains("open")) {
          closeVideoWindow();
        }

        if (menu.classList.contains("open")) {
          closeMenu();
        }

      }

    });

  </script>

</body>
</html>
