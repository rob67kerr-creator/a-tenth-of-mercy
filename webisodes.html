<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Webisodes | A Tenth of Mercy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #000;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow-x: hidden;
    }

    /* --------------------------------------------------
       ROOM
       The artwork is 2:3 (tall). This sizes it so the
       WHOLE picture fits on screen with no scrolling:
       - phones: as wide as the screen allows
       - desktop: as tall as the window allows
    -------------------------------------------------- */

    .room {
      position: relative;

      width: min(100vw, calc(100vh * 2 / 3));
      width: min(100vw, calc(100dvh * 2 / 3));

      line-height: 0;
    }

    .room-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* --------------------------------------------------
       HAMBURGER MENU
    -------------------------------------------------- */

    .menu-button {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 1000;

      width: 48px;
      height: 48px;

      border: 1px solid rgba(210, 166, 70, 0.75);
      border-radius: 4px;

      background: rgba(0, 0, 0, 0.72);
      color: #d8ad52;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;

      transition: background 0.25s ease,
                  transform 0.25s ease;
    }

    .menu-button:hover {
      background: rgba(35, 25, 10, 0.9);
      transform: scale(1.04);
    }

    .menu-button span {
      display: block;
      width: 23px;
      height: 2px;
      background: #d8ad52;
    }

    .menu {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999;

      width: 300px;
      max-width: 85vw;
      height: 100vh;   /* fallback for older browsers */
      height: 100dvh;  /* correct height on phones */

      padding: 90px 35px 40px;

      background: rgba(8, 6, 3, 0.97);
      border-right: 1px solid rgba(210, 166, 70, 0.55);

      transform: translateX(-100%);
      transition: transform 0.35s ease;

      line-height: 1.4;
    }

    .menu.open {
      transform: translateX(0);
    }

    .menu a {
      display: block;
      padding: 14px 0;

      color: #d8ad52;
      text-decoration: none;

      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;

      border-bottom: 1px solid rgba(210, 166, 70, 0.18);

      transition: color 0.2s ease,
                  padding-left 0.2s ease;
    }

    .menu a:hover {
      color: #f2d28a;
      padding-left: 6px;
    }

    .menu a.active {
      color: #f2d28a;
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 998;

      background: rgba(0, 0, 0, 0.55);

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.35s ease;
    }

    .menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* --------------------------------------------------
       CLICKABLE BUTTONS (sit on top of the artwork's
       three built-in buttons). Positions are percentages
       of the image, so they scale with it.
    -------------------------------------------------- */

    .reel {
      position: absolute;
      z-index: 10;

      padding: 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;

      transition: background 0.25s ease,
                  border-color 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .reel:hover,
    .reel:focus-visible {
      background: rgba(212, 167, 74, 0.12);
      border-color: rgba(212, 167, 74, 0.55);
      box-shadow: 0 0 22px rgba(212, 167, 74, 0.25);
      outline: none;
    }

    #reel-one {
      left: 25%;
      top: 48%;
      width: 50.2%;
      height: 7.8%;
    }

    #reel-two {
      left: 25%;
      top: 57.2%;
      width: 50.2%;
      height: 7.8%;
    }

    #reel-three {
      left: 25%;
      top: 66.4%;
      width: 48.8%;
      height: 7.7%;
    }

    /*
      ALIGNMENT TEST (temporary): to see the clickable areas,
      change the <body> tag near the bottom of the page to
      <body class="debug"> and refresh. Change it back when
      everything lines up.
    */

    body.debug .reel {
      border-color: rgba(255, 0, 0, 0.8);
      background: rgba(255, 0, 0, 0.15);
    }

    /* --------------------------------------------------
       VIDEO MODAL
       Each video sets its own shape (--vw and --vh) so a
       video that isn't 16:9 fills the player properly.
    -------------------------------------------------- */

    .video-modal {
      --vw: 16;
      --vh: 9;

      position: fixed;
      inset: 0;
      z-index: 2000;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;

      background: rgba(0, 0, 0, 0.92);

      opacity: 0;
      visibility: hidden;

      transition: opacity 0.3s ease,
                  visibility 0.3s ease;
    }

    .video-modal.open {
      opacity: 1;
      visibility: visible;
    }

    .video-box {
      position: relative;

      /*
        As wide as possible, but never taller than
        about 80% of the screen.
      */
      width: min(1100px, 94vw, calc(80vh * var(--vw) / var(--vh)));
      width: min(1100px, 94vw, calc(80dvh * var(--vw) / var(--vh)));

      background: #000;

      box-shadow:
        0 0 0 1px rgba(212, 167, 74, 0.55),
        0 0 50px rgba(0, 0, 0, 0.9);

      line-height: 0;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: var(--vw) / var(--vh);
    }

    .video-container iframe {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
    }

    .video-title {
      position: absolute;
      left: 0;
      top: -42px;

      color: #d8ad52;

      font-size: 16px;
      letter-spacing: 2px;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .close-video {
      position: absolute;

      top: -50px;
      right: 0;

      width: 38px;
      height: 38px;

      border: 1px solid rgba(212, 167, 74, 0.7);
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.8);
      color: #d8ad52;

      font-family: Arial, sans-serif;
      font-size: 25px;
      line-height: 35px;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;

      transition: background 0.2s ease,
                  color 0.2s ease;
    }

    .close-video:hover {
      background: #d8ad52;
      color: #000;
    }

    /* --------------------------------------------------
       MOBILE
    -------------------------------------------------- */

    @media (max-width: 700px) {

      .menu-button {
        top: 14px;
        left: 14px;

        width: 43px;
        height: 43px;
      }

      .menu {
        width: 280px;
        padding-top: 78px;
      }

      .menu a {
        font-size: 16px;
      }

      .video-modal {
        padding: 15px;
      }

      .video-title {
        top: -34px;
        font-size: 13px;
      }

      .close-video {
        top: -42px;

        width: 32px;
        height: 32px;

        font-size: 21px;
        line-height: 29px;
      }
    }
  </style>
</head>

<body>

  <!-- ================================================
       HAMBURGER BUTTON
  ================================================= -->

  <button
    class="menu-button"
    id="menuButton"
    aria-label="Open menu"
    aria-expanded="false">

    <span></span>
    <span></span>
    <span></span>

  </button>


  <!-- ================================================
       NAVIGATION
  ================================================= -->

  <nav class="menu" id="menu">

    <a href="index.html">Home</a>

    <a href="excerpt.html">Read an Excerpt</a>

    <a href="archive.html">Archive Room</a>

    <a href="webisodes.html" class="active">Webisodes</a>

    <a href="journey.html">The Journey</a>

    <a href="contact.html">Contact</a>

  </nav>

  <div class="menu-overlay" id="menuOverlay"></div>


  <!-- ================================================
       WEBISODES ROOM
  ================================================= -->

  <main class="room">

    <img
      src="webisodes2.png"
      class="room-image"
      alt="Webisodes for A Tenth of Mercy: Episode One, Episode Two, and the Blooper Reel">

    <!-- EPISODE ONE -->
    <button
      class="reel"
      id="reel-one"
      aria-label="Watch Episode One: A Visit to Institute, West Virginia">
    </button>

    <!-- EPISODE TWO -->
    <button
      class="reel"
      id="reel-two"
      aria-label="Watch Episode Two: A Visit to the Cultural Center">
    </button>

    <!-- BLOOPER REEL -->
    <button
      class="reel"
      id="reel-three"
      aria-label="Watch the Blooper Reel">
    </button>

  </main>


  <!-- ================================================
       VIDEO WINDOW
  ================================================= -->

  <div
    class="video-modal"
    id="videoModal"
    aria-hidden="true">

    <div class="video-box">

      <div
        class="video-title"
        id="videoTitle">
      </div>

      <button
        class="close-video"
        id="closeVideo"
        aria-label="Close video">
        ×
      </button>

      <div class="video-container">

        <iframe
          id="videoFrame"
          src=""
          title="A Tenth of Mercy Webisode"
          allow="autoplay; encrypted-media; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>

      </div>

    </div>

  </div>


  <script>

    /* =================================================
       MENU
    ================================================= */

    const menuButton = document.getElementById("menuButton");
    const menu = document.getElementById("menu");
    const menuOverlay = document.getElementById("menuOverlay");

    function toggleMenu() {

      const isOpen = menu.classList.toggle("open");

      menuOverlay.classList.toggle("open", isOpen);

      menuButton.setAttribute("aria-expanded", isOpen);

    }

    function closeMenu() {

      menu.classList.remove("open");

      menuOverlay.classList.remove("open");

      menuButton.setAttribute("aria-expanded", "false");

    }

    menuButton.addEventListener("click", toggleMenu);

    menuOverlay.addEventListener("click", closeMenu);


    /* =================================================
       WEBISODE VIDEOS

       w and h are the SHAPE of each video (width x height).
       Most YouTube videos are 16 x 9.

       If the Blooper Reel looks smaller than the others,
       it is probably a different shape. Change its w and h:
         vertical phone video  ->  w: 9,  h: 16
         old-TV / square-ish   ->  w: 4,  h: 3
         perfect square        ->  w: 1,  h: 1
    ================================================= */

    const videos = {

      "reel-one": {
        title: "Episode 1 — A Visit to Institute, WV",
        id: "VohUntGNZ48",
        w: 16,
        h: 9
      },

      "reel-two": {
        title: "Episode 2 — A Visit to the Cultural Center",
        id: "X7b2kU7Esuw",
        w: 16,
        h: 9
      },

      "reel-three": {
        title: "Blooper Reel",
        id: "kxCJ-v9ibB4",
        w: 9,
        h: 16
      }

    };


    const videoModal = document.getElementById("videoModal");
    const videoFrame = document.getElementById("videoFrame");
    const videoTitle = document.getElementById("videoTitle");
    const closeVideo = document.getElementById("closeVideo");


    function openVideo(reelId) {

      const video = videos[reelId];

      if (!video) {
        return;
      }

      videoTitle.textContent = video.title;

      /* Set the player shape for this video */
      videoModal.style.setProperty("--vw", video.w);
      videoModal.style.setProperty("--vh", video.h);

      videoFrame.src =
        "https://www.youtube-nocookie.com/embed/" +
        video.id +
        "?autoplay=1&rel=0";

      videoModal.classList.add("open");

      videoModal.setAttribute("aria-hidden", "false");

      document.body.style.overflow = "hidden";

    }


    function closeVideoWindow() {

      videoModal.classList.remove("open");

      videoModal.setAttribute("aria-hidden", "true");

      /* Removing the YouTube URL stops the video completely. */
      videoFrame.src = "";

      document.body.style.overflow = "";

    }


    /* Connect each clickable button to its video */

    ["reel-one", "reel-two", "reel-three"].forEach(function(id) {

      document.getElementById(id).addEventListener("click", function() {
        openVideo(id);
      });

    });


    closeVideo.addEventListener("click", closeVideoWindow);


    /* Clicking the dark area outside the video closes it. */

    videoModal.addEventListener("click", function(event) {

      if (event.target === videoModal) {
        closeVideoWindow();
      }

    });


    /* Escape key closes the video or the menu. */

    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {

        if (videoModal.classList.contains("open")) {
          closeVideoWindow();
        }

        if (menu.classList.contains("open")) {
          closeMenu();
        }

      }

    });

  </script>

</body>
</html>
